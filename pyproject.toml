[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecasting"
version = "0.1.0"
description = "Historical retail demand replay and drift-aware forecasting"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pandas>=2.1,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "openpyxl>=3.1,<4",
  "prefect>=3,<4",
  "mlflow>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
